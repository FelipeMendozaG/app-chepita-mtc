steps:
  # ==============================================================================
  # STEP 1: CI Build & Test (T_build)
  # Dependencias, preparación de entorno, pruebas unitarias y generación de cobertura LCOV
  # ==============================================================================
  - name: 'ghcr.io/cirruslabs/flutter:stable'
    id: 'T_build'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        START_TIME=$$(date +%s)
        echo "=========================================================="
        echo " [TELEMETRIA START] T_build: Flutter Pub Get & Tests"
        echo "=========================================================="
        
        git config --global --add safe.directory /workspace
        flutter config --no-analytics

        # Garantizar que el asset .env requerido en pubspec.yaml exista
        if [ ! -f .env ]; then
          if [ -f .env.example ]; then
            echo "Creando .env a partir de .env.example..."
            cp .env.example .env
          else
            touch .env
          fi
        fi

        echo "Resolviendo dependencias..."
        flutter pub get

        echo "Ejecutando suite de pruebas con reporte de cobertura..."
        flutter test --coverage

        echo "Ajustando permisos de espacio de trabajo..."
        chmod -R 777 /workspace

        END_TIME=$$(date +%s)
        DURATION=$$((END_TIME - START_TIME))
        echo "=========================================================="
        echo " [TELEMETRIA FINISH] T_build: $${DURATION}s"
        echo "=========================================================="
        echo "$${DURATION}" > /workspace/t_build_duration.txt

  # ==============================================================================
  # STEP 2: SAST & Quality Gate (T_SAST)
  # Análisis estático de seguridad y código limpio con SonarCloud
  # ==============================================================================
  - name: 'sonarsource/sonar-scanner-cli:latest'
    id: 'T_SAST'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        START_TIME=$$(date +%s)
        echo "=========================================================="
        echo " [TELEMETRIA START] T_SAST: SonarCloud SAST & Quality Gate"
        echo "=========================================================="
        
        sonar-scanner \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.token=$$SONAR_TOKEN \
          -Dsonar.working.directory=/tmp/.scannerwork \
          -Dsonar.userHome=/tmp || echo "[WARNING] Quality Gate no superado en SonarCloud. Continuando pipeline para mediciones y despliegue..."

        END_TIME=$$(date +%s)
        DURATION=$$((END_TIME - START_TIME))
        echo "=========================================================="
        echo " [TELEMETRIA FINISH] T_SAST: $${DURATION}s"
        echo "=========================================================="
        echo "$${DURATION}" > /workspace/t_sast_duration.txt
    secretEnv: ['SONAR_TOKEN']

  # ==============================================================================
  # STEP 3: Compilación de Paquete Release (T_registry)
  # Generación del APK de producción optimizado para Android
  # ==============================================================================
  - name: 'ghcr.io/cirruslabs/flutter:stable'
    id: 'T_registry'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        START_TIME=$$(date +%s)
        echo "=========================================================="
        echo " [TELEMETRIA START] T_registry: Compilación APK Release"
        echo "=========================================================="
        
        git config --global --add safe.directory /workspace
        flutter config --no-analytics

        echo "Compilando APK Release de Android..."
        flutter build apk --release

        echo "Ajustando permisos de artefactos de compilación..."
        chmod -R 777 /workspace/build || true

        END_TIME=$$(date +%s)
        DURATION=$$((END_TIME - START_TIME))
        echo "=========================================================="
        echo " [TELEMETRIA FINISH] T_registry: $${DURATION}s"
        echo "=========================================================="
        echo "$${DURATION}" > /workspace/t_registry_duration.txt

  # ==============================================================================
  # STEP 4: Distribución y Versionado en Cloud Storage (T_CD)
  # Almacenamiento del binario APK versionado por SHA y latest
  # ==============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'T_CD'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        START_TIME=$$(date +%s)
        echo "=========================================================="
        echo " [TELEMETRIA START] T_CD: Publicación a Cloud Storage"
        echo "=========================================================="

        APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
        if [ ! -f "$$APK_PATH" ]; then
          echo "ERROR: No se encontró el binario APK en $$APK_PATH"
          exit 1
        fi

        TAG="$SHORT_SHA"
        if [ -z "$$TAG" ] || [ "$$TAG" = "manual" ]; then
          TAG="$BUILD_ID"
        fi
        BUCKET="gs://chepita-mobile-artifacts"

        echo "Publicando APK versionado ($$TAG)..."
        gcloud storage cp "$$APK_PATH" "$$BUCKET/releases/app-release-$${TAG}.apk"

        echo "Publicando APK latest..."
        gcloud storage cp "$$APK_PATH" "$$BUCKET/releases/app-release-latest.apk"

        END_TIME=$$(date +%s)
        DURATION=$$((END_TIME - START_TIME))
        echo "=========================================================="
        echo " [TELEMETRIA FINISH] T_CD: $${DURATION}s"
        echo "=========================================================="
        echo "$${DURATION}" > /workspace/t_cd_duration.txt

        echo ""
        echo "=========================================================="
        echo " RESUMEN DE TELEMETRÍA PIPELINE DEVSECOPS (en segundos)"
        echo "=========================================================="
        echo " T_build (CI Test & Prep):       $$(cat /workspace/t_build_duration.txt 2>/dev/null || echo '0')s"
        echo " T_SAST (SonarCloud Scan):       $$(cat /workspace/t_sast_duration.txt 2>/dev/null || echo '0')s"
        echo " T_registry (Build APK Release): $$(cat /workspace/t_registry_duration.txt 2>/dev/null || echo '0')s"
        echo " T_CD (Cloud Storage Upload):    $${DURATION}s"
        echo "=========================================================="

# ==============================================================================
# SECRETS CONFIGURATION
# Mapeo de Secret Manager a variables de entorno para Cloud Build
# ==============================================================================
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SONAR_TOKEN/versions/latest
      env: 'SONAR_TOKEN'

# ==============================================================================
# BUILD OPTIONS & RESOURCES
# Configuración de máquina de alta capacidad para compilación móvil Gradle
# ==============================================================================
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
