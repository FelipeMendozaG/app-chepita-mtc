# SonarCloud Configuration for Flutter/Dart
sonar.organization=felipemendozag
sonar.projectKey=FelipeMendozaG_app-chepita-mtc
sonar.projectName=Mobile Simulacros MTC Flutter
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source and Test Directories
sonar.sources=lib
sonar.tests=test
sonar.test.inclusions=test/**/*_test.dart

# Code Coverage Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/build/**,**/.dart_tool/**,**/android/**,**/ios/**,**/web/**,**/windows/**,**/linux/**,**/macos/**

# Quality Gate
sonar.qualitygate.wait=true
